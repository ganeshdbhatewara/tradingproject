name: Scheduled paper research
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, cloud-paper-trading-setup]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Run safe public-data research worker
        run: python worker.py
      - uses: actions/upload-artifact@v4
        with:
          name: paper-research-report
          path: research-report.json
          retention-days: 14
